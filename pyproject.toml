[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stackxai"
version = "0.1.0"
description = "Reproducible stacking-ensemble evaluation with built-in explainability for tabular medical data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sharan Islam" }]
keywords = ["stacking", "ensemble", "interpretability", "SHAP", "medical-ml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
explain = ["shap>=0.45"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "build>=1.0"]

[project.scripts]
stackxai = "stackxai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["stackxai"]
branch = true
